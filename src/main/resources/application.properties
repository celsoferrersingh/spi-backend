# ============================================================
# SPI - Sistema de Visao Computacional Industrial
# Configuracoes da aplicacao
# ============================================================

spring.application.name=spi

# ============================================================
# Banco H2 em modo FILE (dados persistem apos reinicializacao)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/spidb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 habilitado para visualizacao dos dados
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# update: atualiza o schema sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL no console (util para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Servidor
# ============================================================
server.port=8080

# ============================================================
# SPRINT 3 - Datas em ISO-8601
# O app React Native le dataHoraDeteccao como string ISO,
# entao o Jackson nao pode serializar como timestamp numerico.
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
